<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Sasa e Gab</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap');
:root{
  --black:#080808; --paper:#f5f3f0; --ink:#37312d;
  --muted:#8b837c; --line:#ded8d1; --white:#fffdfa;
  --script:'Great Vibes',cursive; /* fonte provisória até trocar pela Symphony */
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--black)}
body{margin:0;min-height:100vh;background:var(--black);color:var(--ink);font-family:Montserrat,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #bca4ad;outline-offset:4px}
.screen{display:none;min-height:100vh}
.screen.active{display:flex;animation:screenIn .65s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ENTRADA */
#home{background:#080808;color:#fff;align-items:center;justify-content:center;flex-direction:column;padding:34px 20px;overflow:hidden}
.home-logo{font-family:var(--script);font-size:clamp(4.3rem,14vw,7rem);line-height:1;color:#f7f5f2;text-align:center;text-shadow:0 3px 22px #ffffff18}
.home-sub{font-size:.58rem;letter-spacing:.3em;color:#bcb7b2;margin:13px 0 35px}
.envelope-stage{width:min(88vw,410px);height:290px;perspective:1000px;position:relative;display:grid;place-items:center}
.envelope{position:relative;width:min(100%,370px);height:230px;background:#eeeae5;border-radius:3px;box-shadow:0 18px 55px #0009;transform-style:preserve-3d}
.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,transparent 49.5%,#d8d1ca 50%,transparent 50.5%),linear-gradient(35deg,transparent 49.5%,#e3ddd6 50%,transparent 50.5%);z-index:3;pointer-events:none}
.envelope-flap{position:absolute;inset:0 0 auto;height:58%;background:#faf8f5;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transform:rotateX(0);transition:transform 1s cubic-bezier(.2,.7,.2,1);z-index:5;backface-visibility:visible;filter:drop-shadow(0 3px 2px #0001)}
.letter{position:absolute;left:7%;right:7%;top:8%;height:82%;background:#fffdfa;color:#37312d;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 14px;z-index:2;transition:transform 1s cubic-bezier(.2,.7,.2,1),opacity .7s}
.letter:before{content:"";position:absolute;inset:9px;border:1px solid #e8e1da;pointer-events:none}
.letter h1{font:clamp(2.5rem,9vw,3.5rem)/1 var(--script);font-weight:400;margin:0 0 12px}
.letter p{font-size:.57rem;letter-spacing:.22em;margin:0 0 20px;color:#827970}
.start{border:1px solid #8d8178;background:transparent;color:#37312d;padding:11px 27px;letter-spacing:.18em;font-size:.65rem;position:relative;z-index:8;transition:background .25s,color .25s,transform .25s}
.start:hover{background:#37312d;color:white;transform:translateY(-2px)}
.lace{position:absolute;inset:-13px;border:8px dotted #eeeae5;opacity:.88;filter:drop-shadow(0 1px 1px #000);pointer-events:none}
.lace:before,.lace:after{content:"";position:absolute;inset:7px;border:2px dashed #eeeae5;border-radius:3px}
.lace:after{inset:-10px;border:1px solid #bdb5ad}
#home.opening .envelope-flap{transform:rotateX(180deg)}
#home.opening .letter{transform:translateY(-105px);opacity:0}
#home.opening .envelope{animation:envelopeOut 1.25s .55s ease forwards}
@keyframes envelopeOut{to{opacity:0;transform:scale(1.08) translateY(-20px)}}

/* MENU PRINCIPAL */
#menu{background:#e9e7e4;color:var(--ink);align-items:center;justify-content:center;flex-direction:column;padding:35px 20px;position:relative;overflow:hidden}
.menu-note{font:clamp(2.1rem,7vw,3.6rem)/1.1 var(--script);text-align:center;color:#554b46;margin:0 0 12px;animation:softUp .8s .15s both}
.menu-brand{font:2.2rem var(--script);margin:0 0 35px;color:#433b36}
.menu-choices{display:grid;grid-template-columns:repeat(2,minmax(0,220px));gap:20px;width:min(100%,470px)}
.menu-choice{border:1px solid #d2cbc4;border-radius:3px;background:#f8f6f3;padding:17px 14px 19px;color:var(--ink);min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:0 7px 22px #4b403d0c;transition:transform .3s,box-shadow .3s,border-color .3s;animation:softUp .75s both}
.menu-choice:nth-child(1){animation-delay:.25s}
.menu-choice:nth-child(2){animation-delay:.42s}
.menu-choice:hover{transform:translateY(-6px);box-shadow:0 14px 30px #4b403d18;border-color:#bca4ad}
.menu-choice .ticket{font-size:4rem;line-height:1;transition:transform .3s}
.menu-choice:hover .ticket{transform:rotate(-7deg) scale(1.08)}
.menu-choice img{width:100%;height:92px;object-fit:contain;display:block;transition:filter .3s,transform .3s}
.menu-choice:hover img{filter:drop-shadow(0 0 8px #d5a9b6);transform:scale(1.04)}
.menu-choice strong{font-size:.67rem;letter-spacing:.15em}
@keyframes softUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* PÁGINAS INTERNAS */
.page{background:#f8f6f3;color:var(--ink);flex-direction:column;padding:22px 22px 55px}
.page-inner{width:min(100%,900px);margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}
.back{background:transparent;border:0;color:var(--muted);font-size:.8rem;padding:8px 0}
.mini{font:2rem var(--script)}
.page-title{font:400 clamp(3.2rem,9vw,5.4rem)/.95 var(--script);text-align:center;margin:10px 0 32px;color:#4b433e}
.page-title.list-title{margin-bottom:34px}
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;min-width:290px}
.table th{font-size:.66rem;letter-spacing:.17em;font-weight:600;text-align:left;padding:12px 15px;border-bottom:1px solid var(--line)}
.table td{height:68px;padding:10px 15px;border-bottom:1px solid var(--line);font-size:.78rem}
.table th:nth-child(2),.table td:nth-child(2){width:205px}
.table th:last-child,.table td:last-child{text-align:center;width:60px}
.item-name{width:100%;border:0;background:transparent;outline:none;color:var(--ink);font-size:.8rem;padding:8px 0}
.item-name::placeholder{color:#c1bab3}
.status{appearance:none;border:1px solid #d8cfc6;border-radius:25px;background:transparent;color:#5b534d;padding:10px 30px 10px 15px;letter-spacing:.12em;font-size:.65rem;max-width:100%}
.delete{border:0;background:transparent;color:#6e655e;font-size:1.2rem;padding:7px}
.add{display:block;margin:35px auto 0;border:1px solid #b9a28e;border-radius:28px;background:transparent;color:#514941;padding:15px 25px;font-size:.7rem;font-weight:600;letter-spacing:.14em;transition:background .2s,transform .2s}
.add:hover{background:#f0e9e4;transform:translateY(-2px)}

/* PLACAR */
.score-title{font:400 clamp(3rem,10vw,5.4rem)/1 var(--script);text-align:center;margin:30px 0 42px;color:#4b433e}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;width:min(100%,570px);margin:0 auto}
.player{text-align:center;background:#fffdfa;border:1px solid #e2dcd5;padding:28px 14px 24px;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 25px #453b3510}
.player-name{font:clamp(2.5rem,8vw,4rem)/1 var(--script);color:#4b433e}
.score-number{font:clamp(3.2rem,11vw,5.2rem)/1 var(--script);margin:15px 0;color:#27211e;font-variant-numeric:tabular-nums}
.score-plus{width:42px;height:42px;border:1px solid #b9a28e;border-radius:50%;background:transparent;color:#514941;font-size:1.5rem;line-height:1;transition:background .2s,color .2s,transform .2s}
.score-plus:hover{background:#514941;color:white;transform:scale(1.08)}
.score-x{font:2.4rem var(--script);color:#9b8d83}
@media(max-width:560px){
 .envelope-stage{height:270px}.envelope{height:205px}
 .menu-choices{gap:10px}.menu-choice{min-height:170px;padding:12px 8px}
 .page{padding:18px 12px 40px}.table th{font-size:.57rem;padding:10px 7px}.table td{padding:8px 7px}
 .table th:nth-child(2),.table td:nth-child(2){width:135px}
 .status{font-size:.57rem;letter-spacing:.07em;padding:9px 17px 9px 9px}
 .scoreboard{gap:7px}.player{padding:22px 5px;min-height:185px}.score-x{font-size:1.8rem}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<section id="home" class="screen active">
  <div class="home-logo">sasa e gab</div>
  <div class="home-sub">DEDICADO A INTERAÇÕES</div>
  <div class="envelope-stage">
    <div class="envelope">
      <div class="letter">
        <h1>Bem vindo</h1>
        <p>UM CANTINHO SÓ NOSSO</p>
        <button class="start" onclick="startSite()">COMEÇAR</button>
      </div>
      <div class="envelope-flap"></div>
    </div>
    <div class="lace"></div>
  </div>
</section>

<section id="menu" class="screen">
  <p class="menu-note">Placar e novas ideias de filme?<br>Clique para atualizar!</p>
  <div class="menu-brand">SASA E GAB</div>
  <div class="menu-choices">
    <button class="menu-choice" onclick="openPage('score')">
      <span class="ticket">🎟️</span><strong>PLACAR</strong>
    </button>
    <button class="menu-choice" onclick="openPage('films')">
      <img src="assets/tv-filminhos.png" alt="Televisão de filminhos"><strong>FILMES</strong>
    </button>
  </div>
</section>

<main id="score" class="screen page">
 <div class="page-inner">
  <div class="top"><button class="back" onclick="showScreen('menu')">← voltar</button><div class="mini">sasa e gab</div></div>
  <h1 class="score-title">Placar</h1>
  <div class="scoreboard">
   <section class="player"><div class="player-name">Gab</div><div class="score-number" id="gabScore">0</div><button class="score-plus" aria-label="Adicionar ponto para Gab" onclick="addPoint('gab')">+</button></section>
   <div class="score-x">×</div>
   <section class="player"><div class="player-name">Sasa</div><div class="score-number" id="sasaScore">0</div><button class="score-plus" aria-label="Adicionar ponto para Sasa" onclick="addPoint('sasa')">+</button></section>
  </div>
 </div>
</main>

<main id="films" class="screen page">
 <div class="page-inner">
  <div class="top"><button class="back" onclick="showScreen('menu')">← voltar</button><div class="mini">sasa e gab</div></div>
  <h1 class="page-title list-title">Lista</h1>
  <div class="table-wrap"><table class="table"><thead><tr><th>FILME</th><th>STATUS</th><th></th></tr></thead><tbody id="filmRows"></tbody></table></div>
  <button class="add" onclick="addFilm()">＋ &nbsp; ADICIONAR FILME</button>
 </div>
</main>

<script>
const FILM_KEY='gabESasa_films_v3';
const SCORE_KEY='gabESasa_score_v1';
let films=[];
let scores={gab:0,sasa:0};
try{films=JSON.parse(localStorage.getItem(FILM_KEY))||[]}catch(e){films=[]}
try{scores={...scores,...JSON.parse(localStorage.getItem(SCORE_KEY))}}catch(e){}
function showScreen(id){
 document.querySelectorAll('.screen').forEach(s=>{s.classList.remove('active');s.style.display='none'});
 const target=document.getElementById(id);target.style.display='flex';
 requestAnimationFrame(()=>target.classList.add('active'));
 if(id==='films')renderFilms();
 if(id==='score')renderScores();
}
function startSite(){
 const home=document.getElementById('home');home.classList.add('opening');
 setTimeout(()=>{home.classList.remove('opening');showScreen('menu')},1450);
}
function openPage(id){showScreen(id)}
function addFilm(){
 const id=Date.now()+Math.floor(Math.random()*1000);
 films.push({id,name:'',status:'Pendente'});saveFilms();renderFilms();
 const el=document.querySelector(`[data-id="${id}"]`);if(el)el.focus();
}
function updateFilm(id,key,value){const item=films.find(x=>x.id===id);if(item){item[key]=value;saveFilms()}}
function removeFilm(id){films=films.filter(x=>x.id!==id);saveFilms();renderFilms()}
function saveFilms(){localStorage.setItem(FILM_KEY,JSON.stringify(films))}
function renderFilms(){
 document.getElementById('filmRows').innerHTML=films.map(item=>`<tr>
 <td><input class="item-name" data-id="${item.id}" aria-label="Nome do filme" placeholder=" " value="${safe(item.name)}" oninput="updateFilm(${item.id},'name',this.value)"></td>
 <td><select class="status" aria-label="Status do filme" onchange="updateFilm(${item.id},'status',this.value)"><option ${item.status==='Pendente'?'selected':''}>Pendente</option><option ${item.status==='Assistido'?'selected':''}>Assistido</option></select></td>
 <td><button class="delete" aria-label="Excluir filme" onclick="removeFilm(${item.id})">×</button></td></tr>`).join('');
}
function addPoint(person){scores[person]=(Number(scores[person])||0)+1;localStorage.setItem(SCORE_KEY,JSON.stringify(scores));renderScores()}
function renderScores(){document.getElementById('gabScore').textContent=scores.gab;document.getElementById('sasaScore').textContent=scores.sasa}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
renderFilms();renderScores();
</script>
</body>
</html>
