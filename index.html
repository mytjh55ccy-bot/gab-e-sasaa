<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gab e sasa</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap');
:root{--bg:#f8f6f3;--ink:#37312d;--muted:#8b837c;--line:#ded8d1;--paper:#fffdfa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
#home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px}
.logo{font-family:'Great Vibes',cursive;font-size:clamp(4rem,13vw,7rem);line-height:1;color:#211d1a}
.sub{font-size:.65rem;letter-spacing:.25em;color:var(--muted);margin:14px 0 38px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,220px));gap:18px;width:min(100%,470px)}
.choice{border:1px solid var(--line);border-radius:15px;background:var(--paper);padding:18px 14px;color:var(--ink);transition:.2s}
.choice:hover{transform:translateY(-3px);border-color:#c5a8b2}
.choice img{width:100%;height:118px;object-fit:contain;display:block;margin-bottom:10px}
.choice .emoji{font-size:3.4rem;display:block;padding:30px 0 24px}
.choice strong{font-size:.72rem;letter-spacing:.08em}
.page{display:none;max-width:940px;margin:auto;padding:24px 22px 55px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}
.back{background:transparent;border:0;color:var(--muted);font-size:.8rem;padding:8px 0}
.mini{font-family:'Great Vibes',cursive;font-size:2rem}
.page-title{font-family:'Great Vibes',cursive;text-align:center;font-size:clamp(3.3rem,9vw,5.7rem);line-height:.95;font-weight:400;margin:12px 0 35px;color:#4b433e}
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;min-width:290px}
.table th{font-size:.66rem;letter-spacing:.17em;font-weight:600;text-align:left;padding:12px 15px;border-bottom:1px solid var(--line)}
.table td{height:68px;padding:10px 15px;border-bottom:1px solid var(--line);font-size:.78rem}
.table th:nth-child(2),.table td:nth-child(2){width:205px}
.table th:last-child,.table td:last-child{text-align:center;width:60px}
.item-name{width:100%;border:0;background:transparent;outline:none;color:var(--ink);font-size:.8rem;padding:8px 0}
.item-name::placeholder{color:#c1bab3}
.status{appearance:none;border:1px solid #d8cfc6;border-radius:25px;background:transparent;color:#5b534d;padding:10px 30px 10px 15px;letter-spacing:.12em;font-size:.65rem;max-width:100%}
.delete{border:0;background:transparent;color:#6e655e;font-size:1.2rem;padding:7px}
.add{display:block;margin:35px auto 0;border:1px solid #b9a28e;border-radius:28px;background:transparent;color:#514941;padding:15px 25px;font-size:.7rem;font-weight:600;letter-spacing:.14em}
.add:hover{background:#f0e9e4}
@media(max-width:560px){.page{padding:18px 12px 40px}.table th{font-size:.57rem;padding:10px 7px}.table td{padding:8px 7px}.table th:nth-child(2),.table td:nth-child(2){width:135px}.status{font-size:.57rem;letter-spacing:.07em;padding:9px 17px 9px 9px}.choices{gap:10px}.choice{padding:12px 9px}.choice img{height:95px}}
</style>
</head>
<body>
<section id="home">
 <div class="logo">gab e sasa</div><div class="sub">NOSSO CANTINHO</div>
 <div class="choices">
  <button class="choice" onclick="openPage('games')"><span class="emoji">🎮</span><strong>JOGOS DA GALERIA</strong></button>
  <button class="choice" onclick="openPage('films')"><img src="assets/tv-filminhos.png" alt="Televisão rosa com lista de filminhos"><strong>FILMINHOS</strong></button>
 </div>
</section>
<main id="games" class="page">
 <div class="top"><button class="back" onclick="home()">← voltar</button><div class="mini">gab e sasa</div></div>
 <h1 class="page-title">Jogos da Galeria</h1>
 <div class="table-wrap"><table class="table"><thead><tr><th>JOGO</th><th>STATUS</th><th></th></tr></thead><tbody id="gameRows"></tbody></table></div>
 <button class="add" onclick="add('games')">＋ &nbsp; ADICIONAR JOGO</button>
</main>
<main id="films" class="page">
 <div class="top"><button class="back" onclick="home()">← voltar</button><div class="mini">gab e sasa</div></div>
 <h1 class="page-title">Lista de<br>Filminhos</h1>
 <div class="table-wrap"><table class="table"><thead><tr><th>FILME</th><th>STATUS</th><th></th></tr></thead><tbody id="filmRows"></tbody></table></div>
 <button class="add" onclick="add('films')">＋ &nbsp; ADICIONAR FILME</button>
</main>
<script>
const KEY='gabESasa_v3';
let data={games:[],films:[]};
try{data=JSON.parse(localStorage.getItem(KEY))||data}catch(e){}
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function openPage(id){document.getElementById('home').style.display='none';document.querySelectorAll('.page').forEach(x=>x.style.display='none');document.getElementById(id).style.display='block';render()}
function home(){document.querySelectorAll('.page').forEach(x=>x.style.display='none');document.getElementById('home').style.display='flex'}
function add(type){const id=Date.now()+Math.floor(Math.random()*1000);data[type].push({id,name:'',status:'Pendente'});persist();render();const el=document.querySelector(`[data-id="${id}"]`);if(el)el.focus()}
function updateName(type,id,value){const item=data[type].find(x=>x.id===id);if(item){item.name=value;persist()}}
function updateStatus(type,id,value){const item=data[type].find(x=>x.id===id);if(item){item.status=value;persist()}}
function remove(type,id){data[type]=data[type].filter(x=>x.id!==id);persist();render()}
function render(){[['games','gameRows'],['films','filmRows']].forEach(([type,target])=>{document.getElementById(target).innerHTML=data[type].map(item=>`<tr><td><input class="item-name" data-id="${item.id}" aria-label="Nome" placeholder=" " value="${safe(item.name)}" oninput="updateName('${type}',${item.id},this.value)"></td><td><select class="status" aria-label="Status" onchange="updateStatus('${type}',${item.id},this.value)"><option ${item.status==='Pendente'?'selected':''}>Pendente</option><option ${item.status==='Assistido'?'selected':''}>Assistido</option></select></td><td><button class="delete" aria-label="Excluir" onclick="remove('${type}',${item.id})">×</button></td></tr>`).join('')})}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script>
</body></html>
